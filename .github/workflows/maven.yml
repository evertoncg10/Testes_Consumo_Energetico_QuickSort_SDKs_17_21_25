name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      framework:
        type: number
        description: 'Java Framework Version'

defaults:
  run:
    shell: bash
    working-directory: ./green-sorting-experiment-java-${{ inputs.framework }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK ${{ inputs.framework }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.framework }}
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
